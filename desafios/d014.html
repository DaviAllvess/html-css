<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            border-collapse: collapse;
        }

        th{
            border: 1px solid black;
        }

        .pri{
            border: 1px solid black;
            padding: 30px;
            background-color: gray;
            color: white;
        }

        td{
            border: 1px solid black;
            padding: 10px;
        }

        #n1{
            background-color: white;
            color: black;
        }

        .ME{
            padding: 5px;
            background-color: gray;
            color: white;
            text-align: left;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th class="pri">Área</th>
                <th class="pri">Disciplina</th>
                <th colspan="2" class="pri">Notas</th>
                <th class="pri">Média</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th rowspan="4" id="n1">Exatas</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td> 
            </tr>
            <th colspan="4" class="ME">Média de Exatas</th>
            <th class="ME">0.0</th>

            <tr>
                <th rowspan="4" id="n1">Humanas</th>
                <td>Histórias</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
        </tbody>

        <tfoot>
            <th colspan="4" class="ME">Média de Humanas</th>
            <th class="ME">0.0</th>
        </tfoot>
    </table>
</body>
</html>
